defaults:
  - _self_          # base applies first; groups below have higher priority
  - model: mlp_rollout
  - loss: smoothl1
  - size: L
  - stratification: mtg
  - horizon: h24

# --- derived keys (resolved lazily by OmegaConf) ---
_spatial:    ${_stratification}_${_size}
_statistics: ${_stratification}_${_size}
_experiment: ${_loss}_${_horizon}_v9

# eodata-main .eozarr store names (data version)
_seviri_store:   seviri_2016_2024
_era5_store:     era5_2014_2025
_era5land_store: era5_land_2016_2025

# schematic load specs (which vars from which store leaf) — split-invariant.
# Names come from here (not the reader schema); they drive the reader's per-leaf
# *_variables kwargs and the named channels the collator packs. Model roles
# (prognostics / inputs / context_vars) live in the model group and reference these
# names plus the computed features (solar_zenith, doy_*, hod_*).
_seviri_load:
  data: [LST, MLE, MH]
  data_daily: [FVC]
  data_static: [DEM]
  data_static_categorical: [LWMASK, LANDCOV]
  metadata: [quality_flag, standard_error]   # cached raw; standard_error drives the quality mask

# Quality mask: NaN the target where the retrieval error exceeds se_max (absolute Kelvin, stable
# across the 2021 flag-encoding change). Referenced by train/val seviri; test stays unmasked.
_quality_mask:
  field: standard_error
  se_max: 1.8
  target: LST
_era5_load:
  data: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc]
  data_static_categorical: [tvh, tvl, lsm, slt]
_era5land_load:
  data: [stl1, stl2, swvl1, swvl2, t2m, d2m, skt]

modality_ids: [era5, era5_land, seviri]

train_dataset:
  spatial: ${_spatial}
  anchor: mtg
  temporal: train
  era5:
    modality_id: era5
    store: ${_era5_store}
    load: ${_era5_load}
    normalization: zscore
    lookback: 24
  era5_land:
    modality_id: era5_land
    store: ${_era5land_store}
    load: ${_era5land_load}
    normalization: zscore
    lookback: 24
  seviri:
    modality_id: seviri
    store: ${_seviri_store}
    load: ${_seviri_load}
    normalization: zscore
    lookback: 24
    quality_mask: ${_quality_mask}

val_dataset:
  spatial: ${_spatial}
  anchor: mtg
  temporal: val
  era5:
    modality_id: era5
    store: ${_era5_store}
    load: ${_era5_load}
    normalization: zscore
    lookback: 24
  era5_land:
    modality_id: era5_land
    store: ${_era5land_store}
    load: ${_era5land_load}
    normalization: zscore
    lookback: 24
  seviri:
    modality_id: seviri
    store: ${_seviri_store}
    load: ${_seviri_load}
    normalization: zscore
    lookback: 24
    quality_mask: ${_quality_mask}

test_dataset:
  spatial: ${_spatial}
  anchor: mtg
  temporal: test_period_00
  era5:
    modality_id: era5
    store: ${_era5_store}
    load: ${_era5_load}
    normalization: zscore
    lookback: 24
  era5_land:
    modality_id: era5_land
    store: ${_era5land_store}
    load: ${_era5land_load}
    normalization: zscore
    lookback: 24
  seviri:
    modality_id: seviri
    store: ${_seviri_store}
    load: ${_seviri_load}
    normalization: zscore
    lookback: 24

training:
  max_epochs: 75
  batch_size: 512
  num_workers: 24
  pin_memory: true
  prefetch_factor: 2
  limit_train_batches: 2500
  limit_val_batches: 500
  limit_test_batches: 1.0
  overfit_batches: 0.0


wandb_logger: true
csv_logger: true
profiler: false
early_stopping: true

# --- runtime flags (CLI overrides) ---
smoke: false
tag: null
hpo_path: nas/hpo_best.json   # set hpo=true to load; override with hpo_path=<other.json>
hpo: false

hydra:
  run:
    dir: ${hydra:runtime.cwd}
  output_subdir: null
  job_logging:
    root:
      level: WARNING
