defaults:
  - _self_          # base applies first; groups below have higher priority
  - model: mlp_rollout
  - loss: mse
  - stratification: KG
  - size: L
  - horizon: h4

# --- derived keys (resolved lazily by OmegaConf) ---
_spatial:    ${_stratification}_${_size}
_statistics: ${_stratification}_${_size}
_experiment: ${_stratification}_${_loss}_${_horizon}_v6

modality_ids: [era5, seviri]

train_dataset:
  spatial: ${_spatial}
  temporal: train
  era5:
    preload: true
    modality_id: era5
    inputs: [stl1, swvl1, t2m, d2m, sp, u10, v10, ssrd, strd, tp, cp, tcwv, tvh, tvl, lsm, solar_zenith]
    prognostics: []
    diagnostics: []
    normalization: zscore
    row_extent: 721
    col_extent: 1440
    lookback: 24
    statistics: ${_statistics}
  seviri:
    preload: true
    modality_id: seviri
    normalization: zscore
    row_extent: 3201
    col_extent: 3201
    lookback: 24
    statistics: ${_statistics}

val_dataset:
  spatial: ${_spatial}
  temporal: val
  era5:
    preload: true
    modality_id: era5
    inputs: [stl1, swvl1, t2m, d2m, sp, u10, v10, ssrd, strd, tp, cp, tcwv, tvh, tvl, lsm, solar_zenith]
    prognostics: []
    diagnostics: []
    normalization: zscore
    row_extent: 721
    col_extent: 1440
    lookback: 24
    statistics: ${_statistics}
  seviri:
    preload: true
    modality_id: seviri
    normalization: zscore
    row_extent: 3201
    col_extent: 3201
    lookback: 24
    statistics: ${_statistics}

test_dataset:
  spatial: ${_spatial}
  temporal: test_period_00
  era5:
    preload: true
    modality_id: era5
    inputs: [stl1, swvl1, t2m, d2m, sp, u10, v10, ssrd, strd, tp, cp, tcwv, tvh, tvl, lsm, solar_zenith]
    prognostics: []
    diagnostics: []
    normalization: zscore
    row_extent: 721
    col_extent: 1440
    lookback: 24
    statistics: ${_statistics}
  seviri:
    preload: true
    modality_id: seviri
    normalization: zscore
    row_extent: 3201
    col_extent: 3201
    lookback: 24
    statistics: ${_statistics}

training:
  max_epochs: 75
  batch_size: 512
  num_workers: 24
  pin_memory: true
  prefetch_factor: 2
  limit_train_batches: 2500
  limit_val_batches: 500
  limit_test_batches: 1.0
  overfit_batches: 0.0


wandb_logger: true
csv_logger: true
profiler: false
early_stopping: true

# --- runtime flags (CLI overrides) ---
smoke: false
tag: null
hpo_path: nas/hpo_best.json   # set hpo=true to load; override with hpo_path=<other.json>
hpo: false

hydra:
  run:
    dir: ${hydra:runtime.cwd}
  output_subdir: null
  job_logging:
    root:
      level: WARNING
