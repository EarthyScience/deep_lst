defaults:
  - _self_          # base applies first; groups below have higher priority
  - model: mlp_rollout
  - loss: smoothl1
  - horizon: h24
  - data: full

_spatial:    mtg_new
_lookback:   24
_experiment: ${_loss}_${_horizon}_${_data}_v14

_temporal_train: train_full_2023b10
_temporal_val:   val_2023b10

# eodata-main .eozarr store names (data version)
_seviri_store:   seviri_2016_2024
_era5_store:     era5_2014_2025
_era5land_store: era5_land_2016_2025


_seviri_load:
  data: [LST, MLE, MH]   # MLE, MH: loaded but unused in v13 — not model inputs (see conf/data/full.yaml)
  data_daily: [FVC]
  data_static: [DEM]
  data_static_categorical: [LWMASK, LANDCOV]
  metadata: [quality_flag, standard_error]   # cached raw; both unused in v13

_era5_load:
  data: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc]
  data_static_categorical: [tvh, tvl, lsm, slt]
_era5land_load:
  data: [stl1, stl2, swvl1, swvl2, t2m, d2m, skt]

modality_ids: [era5, era5_land, seviri]

train_dataset:
  spatial: ${_spatial}
  stats_spatial: ${_spatial}   # selection the stats zarrs were computed on (stays fixed for eval regions)
  anchor: mtg
  temporal: ${_temporal_train}
  era5:
    store: ${_era5_store}
    load: ${_era5_load}
    lookback: ${_lookback}
  era5_land:
    store: ${_era5land_store}
    load: ${_era5land_load}
    lookback: ${_lookback}
  seviri:
    store: ${_seviri_store}
    load: ${_seviri_load}
    lookback: ${_lookback}

val_dataset:
  spatial: ${_spatial}
  stats_spatial: ${_spatial}
  anchor: mtg
  temporal: ${_temporal_val}
  era5:
    store: ${_era5_store}
    load: ${_era5_load}
    lookback: ${_lookback}
  era5_land:
    store: ${_era5land_store}
    load: ${_era5land_load}
    lookback: ${_lookback}
  seviri:
    store: ${_seviri_store}
    load: ${_seviri_load}
    lookback: ${_lookback}

test_dataset:
  spatial: ${_spatial}
  stats_spatial: ${_spatial}
  anchor: mtg
  temporal: test_period_00
  era5:
    store: ${_era5_store}
    load: ${_era5_load}
    lookback: ${_lookback}
  era5_land:
    store: ${_era5land_store}
    load: ${_era5land_load}
    lookback: ${_lookback}
  seviri:
    store: ${_seviri_store}
    load: ${_seviri_load}
    lookback: ${_lookback}

training:
  max_epochs: 100
  batch_size: 512
  num_workers: 24
  pin_memory: true
  prefetch_factor: 2
  limit_train_batches: 2500
  limit_val_batches: 500
  limit_test_batches: 1.0
  overfit_batches: 0.0


wandb_logger: true
csv_logger: true
profiler: false
early_stopping: false


smoke: false
tag: null
hpo_path: nas/hpo_best.json   # set hpo=true to load; override with hpo_path=<other.json>
hpo: false
resume_ckpt: null   # path to a last.ckpt to resume a walltime-killed run (restores epoch/optimizer/scheduler; logs to the next version_ dir)

hydra:
  run:
    dir: ${hydra:runtime.cwd}
  output_subdir: null
  job_logging:
    root:
      level: WARNING
