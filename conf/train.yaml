defaults:
  - _self_          # base applies first; groups below have higher priority
  - sources: eozarr
  - model: mlp
  - objective: rollout
  - loss: smoothl1
  - optim: adamw_cosine
  - horizon: h24
  - data: full


config_version: 2

paths:
  eozarr_root: null
  preload_cache_root: null

# --- derived keys (resolved lazily by OmegaConf) ---
_spatial:    mtg_new
_spatial_val: eval_mtg_new_val
_version:    v18
_temporal_train: train_full_2023b10
_temporal_val:   val_2023b10


window:
  lookback: 168

modality_ids: [era5, era5_land, seviri]

splits:
  train:
    spatial: ${_spatial}
    stats_spatial: ${_spatial}   # selection the stats zarrs were computed on (stays fixed for eval regions)
    anchor: mtg
    temporal: ${_temporal_train}
  val:
    spatial: ${_spatial_val}
    stats_spatial: ${_spatial}
    anchor: mtg
    temporal: ${_temporal_val}
  test:
    spatial: ${_spatial_val}
    stats_spatial: ${_spatial}
    anchor: mtg
    temporal: test_period_00

training:
  max_epochs: 70
  batch_size: 512
  num_workers: 24
  pin_memory: true
  prefetch_factor: 2
  limit_train_batches: 2500
  limit_val_batches: 500
  limit_test_batches: 1.0
  overfit_batches: 0.0


wandb_logger: true
csv_logger: true
profiler: false
early_stopping: false

# --- runtime flags (CLI overrides) ---
smoke: false
tag: null
seed: 42   # pl.seed_everything: init + data order; put it in the tag (tag=..._s<seed>) so runs don't collide
hpo_path: nas/hpo_best.json   # set hpo=true to load; override with hpo_path=<other.json>
hpo: false
resume_ckpt: null   # path to a last.ckpt to resume a walltime-killed run (restores epoch/optimizer/scheduler; logs to the next version_ dir)

hydra:
  run:
    dir: ${hydra:runtime.cwd}
  output_subdir: null
  job_logging:
    root:
      level: WARNING
