defaults:
  - _self_
  - eval: gobabeb

# --- required ---
experiment: ???   # e.g. mlp_rollout_L_KG_mse_h3_v1
version: version_0

# --- populated by the eval group (eval/*.yaml) ---
eval_name: ???
spatial_indices: ???

# --- optional inference flags ---
best: false               # load best.ckpt instead of last.ckpt
no_consistent_mask: true
inference_horizon: ???    # required: rollout horizon in hours (e.g. 72). Use trained horizon value to reproduce training-length forecasts.
n_chunks: null            # distributed inference: total number of GPU array jobs (or read from SLURM_ARRAY_TASK_COUNT)
chunk_offset: null        # distributed inference: 0-indexed chunk for this job (or read from SLURM_ARRAY_TASK_ID)

test_dataset:
  era5:
    preload: true
  seviri:
    preload: true

analysis:
  batch_size: 8192
  num_workers: 16

hydra:
  run:
    dir: ${hydra:runtime.cwd}
  output_subdir: null
  job_logging:
    root:
      level: WARNING
