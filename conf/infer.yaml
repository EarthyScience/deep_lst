defaults:
  - _self_
  - eval: gobabeb

# --- required ---
experiment: ???   # e.g. mlp_rollout_L_KG_mse_h3_v1
version: version_0

# --- populated by the eval group (eval/*.yaml) ---
eval_name: ???
spatial_indices: ???

# --- optional inference flags ---
best: false               # load best.ckpt instead of last.ckpt
no_consistent_mask: true
inference_horizon: 72   # rollout horizon in hours. Use the trained value to reproduce training-length forecasts.

test_dataset:
  init_hours: null   # e.g. [0,6,12,18] to thin init times to those UTC hours (default: every hour)
  era5:
    preload: true
  seviri:
    preload: true

analysis:
  batch_size: 24768
  num_workers: 16
  prefetch_factor: 4

hydra:
  run:
    dir: ${hydra:runtime.cwd}
  output_subdir: null
  job_logging:
    root:
      level: WARNING
