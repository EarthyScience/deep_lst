# @package _global_
# Data ablation: full_glofas minus the era5 modality inputs.
# Same modality_ids/load as full_glofas -> reuses its preload cache; only inputs shrink.
_data: noera5

modality_ids: [era5, era5_land, seviri, glofas_v4]

train_dataset:
  era5:
    inputs: []
    context_vars: []
  era5_land:
    inputs: [stl1, stl2, swvl1, swvl2, t2m, d2m, solar_zenith]
    context_vars: [stl1, stl2, swvl1, swvl2, t2m, d2m, solar_zenith]
  glofas_v4:
    inputs: [swir, rowe]
    context_vars: [swir, rowe]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin, hod_cos, hod_sin]
