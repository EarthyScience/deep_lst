# @package _global_
# v18 no. 1: full (the former noera5static) minus the ERA5-Land soil temperatures stl1, stl2.
# Same modality_ids/load as full -> reuses its preload cache; only the model roles change.
_data: noera5static_nostl

train_dataset:
  era5:
    inputs: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, solar_zenith]
    context_vars: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, solar_zenith]
  era5_land:
    inputs: [swvl1, swvl2, t2m, d2m, solar_zenith]
    context_vars: [swvl1, swvl2, t2m, d2m, solar_zenith]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin, hod_cos, hod_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]

val_dataset:
  era5:
    inputs: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, solar_zenith]
    context_vars: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, solar_zenith]
  era5_land:
    inputs: [swvl1, swvl2, t2m, d2m, solar_zenith]
    context_vars: [swvl1, swvl2, t2m, d2m, solar_zenith]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin, hod_cos, hod_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]

test_dataset:
  era5:
    inputs: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, solar_zenith]
    context_vars: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, solar_zenith]
  era5_land:
    inputs: [swvl1, swvl2, t2m, d2m, solar_zenith]
    context_vars: [swvl1, swvl2, t2m, d2m, solar_zenith]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin, hod_cos, hod_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]
