# @package _global_
# Pre-v18 full (v16/v17 runs): with the ERA5 static fields tvh, tvl, lsm, slt. Since v18
# `full` (full.yaml) is this minus the statics, which contribute nothing (v18 ablation no. 0).
_data: full_era5static

train_dataset:
  era5:
    inputs: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, tvh, tvl, lsm, slt, solar_zenith]
    context_vars: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, solar_zenith]
  era5_land:
    inputs: [stl1, stl2, swvl1, swvl2, t2m, d2m, solar_zenith]
    context_vars: [stl1, stl2, swvl1, swvl2, t2m, d2m, solar_zenith]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin, hod_cos, hod_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]

val_dataset:
  era5:
    inputs: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, tvh, tvl, lsm, slt, solar_zenith]
    context_vars: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, solar_zenith]
  era5_land:
    inputs: [stl1, stl2, swvl1, swvl2, t2m, d2m, solar_zenith]
    context_vars: [stl1, stl2, swvl1, swvl2, t2m, d2m, solar_zenith]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin, hod_cos, hod_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]

test_dataset:
  era5:
    inputs: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, tvh, tvl, lsm, slt, solar_zenith]
    context_vars: [sp, u10, v10, ssrd, strd, tp, tcwv, tcc, solar_zenith]
  era5_land:
    inputs: [stl1, stl2, swvl1, swvl2, t2m, d2m, solar_zenith]
    context_vars: [stl1, stl2, swvl1, swvl2, t2m, d2m, solar_zenith]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin, hod_cos, hod_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]
