    context_vars: [stl1, stl2, swvl1, swvl2, t2m, d2m, solar_zenith]
  seviri:
    inputs: [solar_zenith, doy_cos, doy_sin, hod_cos, hod_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]

