# @package _global_
# mlp_rollout trained with init_fill always: the analysis head and the rollout started from it
# (the analysis for every sample).
# Run with data=full_joint. The variant sits in the run name through _model_name.
defaults:
  - mlp_rollout
  - _self_

_model_name: mlp_always

model:
  init_fill: always
