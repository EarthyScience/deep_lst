# @package _global_

# Helper keys for loss-group forward references
_model_name: transformer
_sigma_prognostics: []
_sigma_diagnostics: []

model:
  name: transformer
  d_model: 256
  n_heads: 4
  n_layers: 4
  dim_feedforward: 512
  encoder_weights: None # Not active.
  learning_rate: 3.7e-4
  dropout: 0.005
  activation: gelu
  step_loss: RolloutLoss
  loss_fn: smooth_l1
  checkpoint_monitor: val_loss_step_epoch_log
  detach_rollout: false
  incremental_loss: true
  probabilistic: false
  scheduler_T0: 80000
  weight_decay: 0.0001
  warmup_steps: 20000
  norm_first: false # not active
