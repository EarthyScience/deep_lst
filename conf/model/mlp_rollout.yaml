# @package _global_

# Helper keys for loss-group forward references
_model_name: mlp_rollout
_step_loss_mse: RolloutMSE
_step_loss_crps: RolloutCRPS
_sigma_prognostics: [LST]
_sigma_diagnostics: []

train_dataset:
  era5:
    context_vars: [stl1, swvl1, t2m, d2m, sp, u10, v10, ssrd, strd, tp, cp, tcwv, solar_zenith]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]

val_dataset:
  era5:
    context_vars: [stl1, swvl1, t2m, d2m, sp, u10, v10, ssrd, strd, tp, cp, tcwv, solar_zenith]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]

test_dataset:
  era5:
    context_vars: [stl1, swvl1, t2m, d2m, sp, u10, v10, ssrd, strd, tp, cp, tcwv, solar_zenith]
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin]
    prognostics: [LST]
    diagnostics: []
    context_vars: [LST]

model:
  name: mlp
  hidden_sizes: [512, 256, 256, 128, 256]
  learning_rate: 0.0001
  dropout: 0.2
  activation: relu
  use_residual: true
  step_loss: ${_step_loss_mse}
  checkpoint_monitor: val_loss_step_epoch
  detach_rollout: false
  incremental_loss: true
  predict_anomaly: false
  scheduler_T0: 80000
  weight_decay: 0.0001
  warmup_steps: 20000
