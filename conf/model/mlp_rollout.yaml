# @package _global_

# Helper keys for loss-group forward references
_model_name: mlp
_sigma_prognostics: []
_sigma_diagnostics: []

model:
  name: mlp
  hidden_sizes: [1024,512,256,256,128]
  learning_rate: 3.7e-4
  dropout: 0.005
  activation: gelu
  use_residual: true
  use_layer_norm: true
  step_loss: RolloutLoss
  loss_fn: smooth_l1
  checkpoint_monitor: val_loss_step_epoch_log
  detach_rollout: false
  incremental_loss: true
  probabilistic: false
  scheduler_T0: 80000
  weight_decay: 0.0001
  warmup_steps: 20000
