# @package _global_

# Helper keys for loss-group forward references
_model_name: mlp_diag
_step_loss_mse: DiagnosticMSE
_step_loss_crps: DiagnosticCRPS
_sigma_prognostics: []
_sigma_diagnostics: [LST]

train_dataset:
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin]
    prognostics: []
    diagnostics: [LST]

val_dataset:
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin]
    prognostics: []
    diagnostics: [LST]

test_dataset:
  seviri:
    inputs: [FVC, DEM, LWMASK, LANDCOV, solar_zenith, doy_cos, doy_sin]
    prognostics: []
    diagnostics: [LST]

model:
  name: mlp
  hidden_sizes: [512, 256, 256, 128, 256]
  learning_rate: 0.0001
  dropout: 0.2
  activation: relu
  use_residual: true
  probabilistic: false
  step_loss: ${_step_loss_mse}
  checkpoint_monitor: val_loss_step_epoch
