[project]
authors=[
    { name = "Marieke Wesselkamp", email = "mwessel@bgc-jena.mpg.de"},
]
maintainers=[
        { name = "Marieke Wesselkamp", email = "mwessel@bgc-jena.mpg.de"},
        { name = "Ramin Yazdani", email = "ryazdani@bgc-jena.mpg.de"},
]
name = "deep_lst"
version = "1.0.0"
description = "Multi-modal and light-weight land surface temperature forecasting"
readme = "README.md"

requires-python = ">=3.12,<3.13"
dependencies = [
    "fastparquet>=2024.11.0",
    "geopandas>=1.1.1",
    "ipykernel>=7.0.1",
    "matplotlib>=3.10.7",
    "netcdf4>=1.7.3",
    "odc>=0.1.2",
    "odc-geo>=0.4.10",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pytorch-lightning>=2.5.5",
    "tensordict>=0.10.0",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "wandb>=0.22.3",
    "xarray>=2025.6.1",
    "eodata",
    "zarr>=3.0.0",
    "cartopy>=0.25.0",
    "hydra-core>=1.3",
    "optuna>=4.8.0",
    "optuna-integration>=4.8.0",
    "climpred>=2.6.0",
    "xskillscore>=0.0.29",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
eodata = { path = "../eodata_slim", editable = true }

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
eodata = [
    "odc-geo>=0.4.10",
    "geopandas>=1.1.1",
    "odc>=0.1.2",
    "tqdm>=4.67.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["."]
include = ["deep_lst*"]
exclude = ["plots*", "wandb*", "assets*", "configs*", "notebooks*", "checkpoints*", "experiments*"]
