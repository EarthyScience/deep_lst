[project]
name = "deep_lst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.11,<3.13"
dependencies = [
    "fastparquet>=2024.11.0",
    "flatdict>=4.0.1",
    "geopandas>=1.1.1",
    "ipykernel>=7.0.1",
    "matplotlib>=3.10.7",
    "netcdf4>=1.7.3",
    "odc>=0.1.2",
    "odc-geo>=0.4.10",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pytorch-lightning>=2.5.5",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "wandb>=0.22.3",
    "xarray>=2025.10.1",
    "wedata",
    "zarr~=0.1.dev2719",     #"zarr>=3.1.3",
]

[tool.uv.sources]
wedata = { path = "../wedata", editable = true }
zarr = { path = "../zarr-python", editable = true}

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.14",
]
wedata = [
    "odc-geo>=0.4.10",
    "geopandas>=1.1.1",
    "odc>=0.1.2",
    "tqdm>=4.67.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "deep_lst/inference/verification.py",
    "deep_lst/inference/inference.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
