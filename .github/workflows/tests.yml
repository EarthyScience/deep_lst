name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # CPU-only torch to keep install fast; eodata is a local path dep not
          # available on CI — tests that need it are skipped via importorskip.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytorch-lightning tensordict omegaconf numpy pytest
          pip install --no-deps -e .
          pip install uv && uv sync --no-install-package eodata

      - name: Run tests
        run: pytest tests/ -v
