training:
  max_epochs: 70
  batch_size: 512
  num_workers: 24
  pin_memory: true
  prefetch_factor: 2
  limit_train_batches: 2500
  limit_val_batches: 500
  limit_test_batches: 1.0
  overfit_batches: 0.0
wandb_logger: true
csv_logger: true
profiler: false
early_stopping: false
smoke: false
tag: null
seed: 42
hpo_path: nas/hpo_best.json
hpo: false
resume_ckpt: null
_model_name: mlp_gated
_sigma_prognostics: []
_sigma_diagnostics: []
model:
  name: mlp
  hidden_sizes:
  - 1024
  - 512
  - 256
  - 256
  - 128
  learning_rate: 0.00037
  dropout: 0.005
  activation: gelu
  use_residual: true
  use_layer_norm: true
  static_encoding: integer
  diagnostic_history: true
  init_fill: gated
  init_hide_fraction: 0.5
  step_loss: RolloutLoss
  loss_fn: smooth_l1
  checkpoint_monitor: val_loss_step_epoch_log
  detach_rollout: false
  teacher_forcing_loss: true
  incremental_loss: false
  rollout_loss: true
  probabilistic: false
  scheduler_T0: 80000
  weight_decay: 0.0001
  warmup_steps: 20000
_loss: smoothl1
_horizon: h24
_data: full_joint
