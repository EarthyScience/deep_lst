  start_time: '2017-12-15 01:00'
  end_time: '2017-12-15 04:00'
  era5:
    modality_id: era5
    inputs: [stl1, swvl1, t2m, d2m, sp, u10, v10, ssrd, strd, tp, cp, sf, tcwv, tvh, tvl, lsm]
    prognostics: []
    diagnostics: []
