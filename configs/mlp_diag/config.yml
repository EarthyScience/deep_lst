model:
  name: mlp
  hidden_sizes: [256, 128, 128, 64, 128]
  learning_rate: 0.0001
  dropout: 0.2
  activation: 'relu'
  step_loss: DiagnosticMSE # options: DiagnosticMSE, RolloutMSE

training:
  max_epochs: 35
  batch_size: 96
  num_workers: 24
  pin_memory: True
  prefetch_factor: 1 # default
  limit_train_batches: 2500
  limit_val_batches: 500
  overfit_batches: 0.0 #5 # 0.0  # Use only 5 batches for both train/val

analysis:
  batch_size: 512
  num_workers: 8
  pin_memory: True

experiment: johannesburg
name: mlp_diag
wandb_logger: True
csv_logger: True
profiler: False
